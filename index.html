<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TIME TAP</title>
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Fredoka:wght@600;700&family=Lilita+One&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="bg-blocks">
        <div class="b-tile t1"></div>
        <div class="b-tile t2"></div>
        <div class="b-tile t3"></div>
        <div class="b-tile t4"></div>
        <div class="b-tile t5"></div>
        <div class="b-tile t6"></div>
    </div>

    <div id="menu">
        <!-- Pulsante sinistro in alto (predisposto per future funzioni) -->
        <button id="leftTopBtn" class="top-icon-btn left-pos" aria-label="Extra">✨</button>

        <!-- Pulsanti destri in alto: Impostazioni + Livello sotto -->
        <div class="right-top-stack">
            <button id="settingsBtn" class="top-icon-btn" aria-label="Impostazioni">⚙️</button>
            <button id="rankBtn" class="top-icon-btn rank-trigger" aria-label="Livelli">🏆</button>
        </div>

        <!-- Logo 3D -->
        <div class="logo-wrapper">
            <div class="logo-row row-top">
                <div class="block-letter c-red">T</div>
                <div class="block-letter c-orange">I</div>
                <div class="block-letter c-yellow">M</div>
                <div class="block-letter c-green">E</div>
            </div>
            <div class="logo-row row-bottom">
                <div class="block-letter c-cyan">T</div>
                <div class="block-letter c-purple">A</div>
                <div class="block-letter c-pink">P</div>
            </div>
        </div>

        <!-- Record e Combo centrati sopra PLAY -->
        <div class="home-stats-centered">
            <div class="stat-pill gold-pill">
                <span class="pill-icon">👑</span>
                <span id="record">0</span>
            </div>
            <div class="stat-pill fire-pill">
                <span class="pill-icon">🔥</span>
                <span id="bestComboHome">0</span>
            </div>
        </div>

        <button id="playBtn">PLAY</button>
    </div>

    <!-- MODALE IMPOSTAZIONI -->
    <div id="settingsModal" class="modal-overlay">
        <div class="modal-card">
            <div class="modal-header">
                <h3>SETTINGS</h3>
                <button id="closeSettingsBtn" class="close-modal-btn">✕</button>
            </div>
            <div class="setting-row">
                <span>Sound Effects</span>
                <button id="audioToggleBtn" class="toggle-pill-btn">🔊 ON</button>
            </div>
        </div>
    </div>

    <!-- MODALE 7 LIVELLI ESPONENZIALI -->
    <div id="rankModal" class="modal-overlay">
        <div class="modal-card rank-card-modal">
            <div class="modal-header">
                <h3>PLAYER RANK</h3>
                <button id="closeRankBtn" class="close-modal-btn">✕</button>
            </div>
            <div class="current-rank-banner">
                <div id="currentRankBadge" class="rank-badge-title">1. ROOKIE</div>
                <div id="currentXpLabel" class="xp-counter-text">0 / 100.000 XP</div>
            </div>
            <div class="progress-track-wrapper">
                <div class="progress-track">
                    <div id="xpProgressFill" class="progress-fill"></div>
                </div>
                <div id="nextRankHint" class="next-rank-hint">Next: Challenger</div>
            </div>
            <div id="rankStepsList" class="rank-steps-list"></div>
        </div>
    </div>

    <!-- MODALE RIPRENDI PARTITA SALVATA -->
    <div id="resumeModal" class="modal-overlay">
        <div class="modal-card">
            <div class="modal-header">
                <h3>PAUSED RUN</h3>
            </div>
            <p class="resume-desc">You have a saved game in progress!</p>
            <div class="resume-actions">
                <button id="resumeSavedBtn" class="action-green-btn">RESUME</button>
                <button id="discardSavedBtn" class="action-red-btn">NEW</button>
            </div>
        </div>
    </div>

    <div id="countdown">3</div>

    <div id="game">
        <div class="hud-top">
            <div id="score">SCORE: 0</div>
            <div id="combo">COMBO 0</div>
        </div>

        <!-- Pulsante STOP / PAUSA in alto a destra con cooldown -->
        <button id="pauseBtn" class="pause-btn" aria-label="Pausa">
            <span id="pauseIcon">⏸</span>
            <span id="pauseCooldownText" class="pause-cd"></span>
        </button>

        <div id="specialMessage"></div>
        <div id="timerCircle">2.5</div>

        <!-- OVERLAY PAUSA IN CORSO -->
        <div id="pauseOverlay" class="pause-overlay">
            <div class="gameover-panel pause-panel">
                <h2>PAUSED</h2>
                <p class="pause-info">Progress saved automatically.<br>You can close and resume later.</p>
                <div class="gameover-buttons">
                    <button id="resumeBtn">RESUME</button>
                    <button id="quitToHomeBtn">HOME</button>
                </div>
            </div>
        </div>
    </div>

    <div id="gameOverScreen">
        <div class="gameover-panel">
            <h2>GAME OVER</h2>
            <div id="newRecordMessage">👑 NEW BEST! 👑</div>
            <div class="score-showcase">
                <div class="showcase-title">SCORE</div>
                <div id="finalScore" class="showcase-big">0</div>
            </div>
            <div class="mini-stats-row">
                <div class="mini-card gold-card">
                    <div class="mini-label">👑 BEST</div>
                    <div id="finalRecord" class="mini-value">0</div>
                </div>
                <div class="mini-card fire-card">
                    <div class="mini-label">🔥 COMBO</div>
                    <div id="finalCombo" class="mini-value">0</div>
                </div>
            </div>
            <div class="gameover-buttons">
                <button id="playAgainBtn">PLAY</button>
                <button id="homeBtn">HOME</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>

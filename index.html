<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TIME TAP</title>
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Fredoka:wght@700&family=Lilita+One&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- BLOCCHI DECORATIVI SULLO SFONDO STILE BLOCK BLAST -->
    <div class="bg-blocks" aria-hidden="true">
        <span class="b-tile t1"></span>
        <span class="b-tile t2"></span>
        <span class="b-tile t3"></span>
        <span class="b-tile t4"></span>
        <span class="b-tile t5"></span>
        <span class="b-tile t6"></span>
    </div>

    <!-- COUNTDOWN -->
    <div id="countdown"></div>

    <!-- MESSAGGI SPECIALI -->
    <div id="specialMessage"></div>

    <!-- MENU HOME -->
    <div id="menu">

        <div class="home-stats">
            <div class="stat-pill gold-pill">
                <span class="pill-icon">👑</span>
                <span id="record">0</span>
            </div>
            <div class="stat-pill fire-pill">
                <span class="pill-icon">🔥</span>
                <span id="bestComboHome">0</span>
            </div>
        </div>

        <!-- LOGO STILE BLOCK BLAST CON TESSERE 3D -->
        <div class="logo-wrapper">
            <div class="logo-row row-top">
                <span class="block-letter c-red">T</span>
                <span class="block-letter c-orange">I</span>
                <span class="block-letter c-yellow">M</span>
                <span class="block-letter c-green">E</span>
            </div>
            <div class="logo-row row-bottom">
                <span class="block-letter c-cyan">T</span>
                <span class="block-letter c-purple">A</span>
                <span class="block-letter c-pink">P</span>
            </div>
        </div>

        <button id="playBtn">
            PLAY
        </button>

    </div>

    <!-- GIOCO -->
    <div id="game">

        <div class="hud-top">
            <div id="score">SCORE: 0</div>
            <div id="combo">COMBO 0</div>
        </div>

        <div id="timerCircle">
            2.5
        </div>

    </div>

    <!-- GAME OVER -->
    <div id="gameOverScreen">

        <div class="gameover-panel">
            <h2>GAME OVER</h2>

            <div id="newRecordMessage">
                👑 NEW BEST! 👑
            </div>

            <div class="score-showcase">
                <span class="showcase-title">SCORE</span>
                <span id="finalScore" class="showcase-big">0</span>
            </div>

            <div class="mini-stats-row">
                <div class="mini-card gold-card">
                    <span class="mini-label">👑 BEST</span>
                    <span id="finalRecord" class="mini-value">0</span>
                </div>
                <div class="mini-card fire-card">
                    <span class="mini-label">🔥 COMBO</span>
                    <span id="finalCombo" class="mini-value">0</span>
                </div>
            </div>

            <div class="gameover-buttons">
                <button id="playAgainBtn">PLAY</button>
                <button id="homeBtn">HOME</button>
            </div>
        </div>

    </div>

    <!-- SUONI -->
    <audio id="greenSound" src="sounds/green.mp3"></audio>
    <audio id="redSound" src="sounds/red.mp3"></audio>
    <audio id="goldSound" src="sounds/incredible.mp3"></audio>
    <audio id="epicSound" src="sounds/epicsave.mp3"></audio>
    <audio id="threeSound" src="sounds/three.mp3"></audio>
    <audio id="twoSound" src="sounds/two.mp3"></audio>
    <audio id="oneSound" src="sounds/one.mp3"></audio>
    <audio id="goSound" src="sounds/go.mp3"></audio>

    <!-- MUSICA -->
    <audio id="bgMusic" src="sounds/music.mp3" loop></audio>

    <!-- SCRIPT -->
    <script src="script.js"></script>

</body>

</html>

<!DOCTYPE html>
<html lang="it">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>TIME TAP</title>

    <link
        rel="stylesheet"
        href="style.css">

</head>

<body>

    <!-- COUNTDOWN -->

    <div id="countdown"></div>

    <!-- MESSAGGI SPECIALI -->

    <div id="specialMessage"></div>

    <!-- NEW RECORD -->

    <div id="newRecordMessage">

        🏆 NEW RECORD! 🏆

    </div>

    <!-- MENU -->

    <div id="menu">

        <div id="record">

            🏆 RECORD: 0

        </div>

        <h1>

            TIME TAP

        </h1>

        <button id="playBtn">

            PLAY

        </button>

    </div>

    <!-- GIOCO -->

    <div id="game">

        <div id="score">

            SCORE: 0

        </div>

        <div id="combo">

            COMBO 0

        </div>

        <div id="timerCircle">

            2.5

        </div>

    </div>

    <!-- GAME OVER -->

    <div id="gameOverScreen">

        <h2>

            GAME OVER

        </h2>

        <div id="finalScore">

            SCORE: 0

        </div>

        <div id="finalRecord">

            RECORD: 0

        </div>

        <button id="playAgainBtn">

            PLAY AGAIN

        </button>

        <button id="homeBtn">

            HOME

        </button>

    </div>

    <!-- SUONI -->

    <audio id="greenSound" src="sounds/green.mp3"></audio>

    <audio id="redSound" src="sounds/red.mp3"></audio>

    <audio id="goldSound" src="sounds/incredible.mp3"></audio>

    <audio id="epicSound" src="sounds/epicsave.mp3"></audio>

    <audio id="threeSound" src="sounds/three.mp3"></audio>

    <audio id="twoSound" src="sounds/two.mp3"></audio>

    <audio id="oneSound" src="sounds/one.mp3"></audio>

    <audio id="goSound" src="sounds/go.mp3"></audio>

    <!-- MUSICA -->

    <audio
        id="bgMusic"
        src="sounds/music.mp3"
        loop>
    </audio>

    <!-- SCRIPT -->

    <script src="script.js"></script>

</body>

</html>
